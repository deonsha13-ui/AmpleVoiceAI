# Local override for the AmpleVoiceAI fork.
# Switches just the ui service to the locally-built custom image so the
# running stack uses our rebranded UI instead of upstream amplevoiceai/amplevoice-ui.
#
# Usage (from the repo root):
#   docker compose -f docker-compose.yaml -f docker-compose.override.yaml up -d
#
# Stopping / restarting with the override:
#   docker compose -f docker-compose.yaml -f docker-compose.override.yaml down

services:
  ui:
    image: amplevoice-fork-ui:custom
    build:
      context: .
      dockerfile: ui/Dockerfile
      args:
        NEXT_PUBLIC_CHATWOOT_URL: ""
        NEXT_PUBLIC_CHATWOOT_TOKEN: ""